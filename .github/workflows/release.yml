name: Release

# 发布流程：推送 v* tag 时自动构建并上传 APK。
#
# 为什么必须在 CI 里注入专用签名密钥：
#   Android 只允许签名相同的 APK 覆盖安装。debug 包默认用
#   $HOME/.android/debug.keystore 签名，而这把密钥是**每台机器随机生成**的：
#   换机器、换 CI runner，签名就变了，用户点「检查更新」后会装不上，
#   只能卸载重装（丢书卷与会话）。2.1.2/2.1.3 正是这样丢掉了签名密钥。
#   因此这里强制要求 4 个 secret 提供项目专用密钥，并在构建前后各校验一次指纹，
#   不匹配直接失败。配置方法见 docs/release-android.md。

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "要发布的 tag（例如 v2.1.5），必须已经推送到仓库"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  # 发布密钥证书指纹（SHA-256，小写、无冒号）。
  #
  # 这把密钥自 2.1.4 起成为本项目的签名身份。历史：
  #   2.1.2 / 2.1.3 用的是 Android SDK 自动生成的 debug 密钥
  #   （3c5cb56d7221ed35ef03240cda3d718dfade061a9614b92aa62b4f299733ee48），
  #   随构建机器丢失，导致 2.1.4 无法覆盖安装 2.1.3、需一次性重装。
  #
  # ⚠️ 更换这里的值等于换签名密钥，已安装用户将无法覆盖安装，
  #    必须走一次有审计的提交，并在发布说明里提前告知。
  #    取值：keytool -list -v -keystore <你的.jks> -alias <alias> | grep SHA256
  EXPECTED_SIGNER_SHA256: "09426ef9eafc96a37ea16c4293d93966eb055a116ef778a598acc359ba8e9049"

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # tag 推送时取该 tag；手动触发时取输入的 tag。
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore signing key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          missing=()
          [ -z "${KEYSTORE_BASE64}" ] && missing+=("ANDROID_KEYSTORE_BASE64")
          [ -z "${STORE_PASSWORD}" ] && missing+=("ANDROID_KEYSTORE_PASSWORD")
          [ -z "${KEY_ALIAS}" ] && missing+=("ANDROID_KEY_ALIAS")
          [ -z "${KEY_PASSWORD}" ] && missing+=("ANDROID_KEY_PASSWORD")
          if [ "${#missing[@]}" -gt 0 ]; then
            {
              echo "::error title=缺少签名 secret::未配置：${missing[*]}"
              echo "CI 用随机 debug 密钥签名会让 APK 无法覆盖安装上一版，用户只能卸载重装。"
              echo "配置方法见 docs/release-android.md。"
            }
            exit 1
          fi

          install -d -m 700 "${HOME}/.android"
          keystore="${HOME}/.android/zaomeng-release.jks"
          printf '%s' "${KEYSTORE_BASE64}" | base64 -d > "${keystore}"
          chmod 600 "${keystore}"

          # 通过 keystore.properties 交给 Gradle（debug / release 两个 build type 都会用它）
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "${keystore}" "${STORE_PASSWORD}" "${KEY_ALIAS}" "${KEY_PASSWORD}" \
            > kmp/keystore.properties

          # 构建前先核对密钥本身，避免白等一次编译
          actual="$(keytool -J-Duser.language=en -list -v -keystore "${keystore}" \
            -storepass "${STORE_PASSWORD}" -alias "${KEY_ALIAS}" \
            | sed -n 's/.*SHA256: //p' | tr -d ':' | tr 'A-Z' 'a-z' | head -n1)"
          if [ "${actual}" != "${EXPECTED_SIGNER_SHA256}" ]; then
            {
              echo "::error title=签名密钥不匹配::期望 ${EXPECTED_SIGNER_SHA256}，实际 ${actual:-<读取失败>}。"
              echo "若这是有意更换签名密钥，请把 .github/workflows/release.yml 的"
              echo "EXPECTED_SIGNER_SHA256 改成新指纹，并在发布说明里告知用户需要重装。"
            }
            exit 1
          fi
          echo "签名密钥指纹：${actual} ✓"

      - name: Build debug APK
        working-directory: kmp
        shell: bash
        run: ./gradlew :app:androidApp:assembleDebug --no-daemon --console=plain --stacktrace

      - name: Verify signature, version and package
        id: apk
        shell: bash
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail

          apk="$(ls -1 kmp/app/androidApp/build/outputs/apk/debug/*.apk | head -n1)"
          echo "构建产物：${apk}"

          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -z "${sdk}" ]; then
            echo "::error title=找不到 Android SDK::ANDROID_HOME 与 ANDROID_SDK_ROOT 均未设置。"
            exit 1
          fi
          build_tools="$(ls -d "${sdk}"/build-tools/* | sort -V | tail -n1)"
          echo "build-tools: ${build_tools}"

          # 1) 产物签名必须等于配置的发布指纹，否则用户无法覆盖安装。
          #    提取不锚定行首、先统一小写，并把原始输出打进日志；
          #    取不到指纹时**必须当失败处理**——绝不能把"解析失败"当成"校验通过"。
          apksigner_bin="${build_tools}/apksigner"
          certs_raw="$("${apksigner_bin}" verify --print-certs "${apk}" 2>&1 || true)"
          echo "----- apksigner verify --print-certs (raw) -----"
          printf '%s\n' "${certs_raw}"
          echo "----- end raw -----"
          signer="$(printf '%s\n' "${certs_raw}" | tr -d '\r' | tr 'A-Z' 'a-z' \
            | sed -n 's/.*sha-256 digest:[[:space:]]*//p' \
            | tr -d ':' | tr -d '[:space:]' | head -n1)"
          if [ -z "${signer}" ]; then
            {
              echo "::error title=无法读取产物签名::apksigner 没有输出可解析的 SHA-256 指纹。"
              echo "原始输出见上方；若显示 DOES NOT VERIFY，说明 keystore.properties 没生效。"
            }
            exit 1
          fi
          if [ "${signer}" != "${EXPECTED_SIGNER_SHA256}" ]; then
            {
              echo "::error title=产物签名不匹配::期望 ${EXPECTED_SIGNER_SHA256}，实际 ${signer}。"
              echo "通常是 keystore.properties 没生效（检查 storeFile 路径与别名）。"
            }
            exit 1
          fi
          echo "签名指纹：${signer} ✓"

          # 2) APK 元数据必须与 tag 对应，避免发出版本号错位的包。
          badging="$("${build_tools}/aapt2" dump badging "${apk}")"
          package_name="$(printf '%s\n' "${badging}" | sed -n "s/^package: name='\([^']*\)'.*/\1/p" | head -n1)"
          version_name="$(printf '%s\n' "${badging}" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p" | head -n1)"
          expected_version="${TAG#v}"
          echo "包名：${package_name}，版本：${version_name}，tag：${TAG}"

          if [ "${version_name}" != "${expected_version}" ]; then
            {
              echo "::error title=版本号不匹配::tag 是 ${TAG}，但 APK 的 versionName 是 ${version_name}。"
              echo "请把 kmp/gradle.properties 的 zaomeng.versionName / zaomeng.versionCode 同步到该版本后再打 tag"
              echo "（版本号唯一来源就是它；kmp/app/androidApp/build.gradle.kts 只是读取，不要在那里写死版本。）"
            }
            exit 1
          fi

          # 3) 更新检查依赖附件名里的 arm64-v8a（见 AppUpdateManager.parseLatestRelease）。
          asset="${RUNNER_TEMP}/zaomeng-${version_name}-arm64-v8a-debug.apk"
          cp "${apk}" "${asset}"

          {
            echo "path=${asset}"
            echo "name=$(basename "${asset}")"
            echo "sha256=$(sha256sum "${asset}" | cut -d' ' -f1)"
            echo "size=$(stat -c%s "${asset}")"
            echo "version=${version_name}"
            echo "package=${package_name}"
          } >> "${GITHUB_OUTPUT}"

      - name: Compose release notes
        shell: bash
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          notes=".github/release-notes/${TAG}.md"
          # 缺发布说明就失败，不用占位文本糊过去：用户看不到「这版改了什么」，
          # 而且这类遗漏应该在发布前被发现，而不是发出去之后。
          if [ ! -f "${notes}" ]; then
            {
              echo "::error title=缺少发布说明::找不到 ${notes}"
              echo "每个 tag 都必须有对应发布说明。参考 .github/release-notes/v2.1.5.md 新建，"
              echo "并同步在 CHANGELOG.md 顶部加一节（scripts/check-release-ready.sh 会检查这些）。"
            }
            exit 1
          fi
          cp "${notes}" "${RUNNER_TEMP}/notes.md"
          {
            echo ""
            echo "### 校验"
            echo ""
            echo '```'
            echo "file:    ${{ steps.apk.outputs.name }}"
            echo "package: ${{ steps.apk.outputs.package }}"
            echo "sha256:  ${{ steps.apk.outputs.sha256 }}"
            echo "size:    ${{ steps.apk.outputs.size }} bytes"
            echo '```'
          } >> "${RUNNER_TEMP}/notes.md"

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          version="${TAG#v}"
          # 幂等：同名 Release 已存在就先删掉重建（tag 本身保留不动）
          gh release delete "${TAG}" --yes || true
          gh release create "${TAG}" "${{ steps.apk.outputs.path }}" \
            --title "造梦 ${version}" \
            --notes-file "${RUNNER_TEMP}/notes.md" \
            --latest \
            --verify-tag
