name: Android CI

on:
  push:
    branches:
      - main
    paths:
      - "kmp/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "kmp/**"
      - ".github/workflows/android.yml"

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run Android checks
        working-directory: kmp
        shell: bash
        run: |
          ./gradlew testDebugUnitTest jvmTest lintDebug assembleDebug --no-daemon --stacktrace --console=plain > /tmp/gradle-ci.log 2>&1 || {
            grep -E 'What went wrong|Caused by:|FAILURE:|Could not|> Task .* FAILED|error:|Exception|not found|Connection|timed? ?out|transfer|403|404|PKIX|SSL|proxy' /tmp/gradle-ci.log | head -60 | sed 's/^/::error::/' || true
            tail -100 /tmp/gradle-ci.log | sed 's/^/::error::tail /' || true
            exit 1
          }
